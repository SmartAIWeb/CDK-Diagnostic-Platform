services:
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: jee-tomcat
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: prediction_app_db
      DB_USER: root
      DB_PASSWORD: root
      ML_API_URL: http://ml-api:5000/predict
    depends_on:
      db:
        condition: service_healthy
      ml-api:
        condition: service_started

  db:
    image: mariadb:11
    container_name: jee-db
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:z
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: prediction_app_db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      retries: 5

  ml-api:
    build:
      context: ./ml-api
      dockerfile: Dockerfile
    container_name: jee-ml
    restart: unless-stopped
    volumes:
      - ./ml-api/api:/app:z
      - ./ml-api/models:/app/models:z
    ports:
      - "5000:5000"
    networks:
      - backend
    depends_on:
      - db

volumes:
  db-data:

networks:
  backend:
    driver: bridge
